[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9" }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
hex = "0.4.3"
owo-colors = "4.4.0"
rand = "0.10.3"
resend-rs = "0.34.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["sqlite"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.28.0", features = ["v4"] }
