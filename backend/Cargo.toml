[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
hex = "0.4.3"
rand = "0.10.3"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["sqlite"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
